[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apab"
version = "0.4.1"
description = "Agentic Phased Array Builder — LLM-driven phased-array antenna design via MCP tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "APAB Contributors" }]
keywords = [
    "phased-array", "antenna", "beamforming", "mcp", "llm", "agent",
    "rf", "electromagnetics", "opentelemetry", "observability",
    "strands-agents", "langgraph", "agentic-workflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "phased-array-modeling>=1.0",
    "phased-array-systems>=0.11",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "rich>=13.0",
    "diskcache>=5.6",
    "mcp>=1.26,<2",
    "h5py>=3.8",
]

[project.urls]
Homepage = "https://github.com/jman4162/agentic-phased-array-builder"
Documentation = "https://jman4162.github.io/agentic-phased-array-builder/"
Repository = "https://github.com/jman4162/agentic-phased-array-builder"
Issues = "https://github.com/jman4162/agentic-phased-array-builder/issues"
Changelog = "https://github.com/jman4162/agentic-phased-array-builder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
edgefem = ["edgefem>=1.0"]
ollama = ["ollama>=0.4"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
gemini = ["google-generativeai>=0.5"]
observability = [
    "opentelemetry-api>=1.43",
    "opentelemetry-sdk>=1.43",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
]
strands = ["strands-agents>=1.46"]
langgraph = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.30",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
    "mypy>=1.5",
    "ruff>=0.1",
    "coverage>=7.0",
    "types-PyYAML>=6.0",
    "twine>=5.0",
    "opentelemetry-api>=1.43",
    "opentelemetry-sdk>=1.43",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
]

[project.scripts]
apab = "apab.cli:main"

[project.entry-points."apab.llm_providers"]
ollama = "apab.providers.ollama:OllamaProvider"
openai = "apab.providers.openai:OpenAIProvider"
anthropic = "apab.providers.anthropic:AnthropicProvider"
gemini = "apab.providers.gemini:GeminiProvider"
openai_compatible = "apab.providers.openai_compat:OpenAICompatibleProvider"

[project.entry-points."apab.compute_backends"]
local = "apab.compute.local:LocalBackend"

[project.entry-points."apab.em_adapters"]

[tool.hatch.build.targets.wheel]
packages = ["src/apab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
# No python_version pin: recent numpy type stubs use `type` statements,
# which mypy rejects when analyzing as 3.10/3.11. Runtime 3.10 support
# is covered by the test matrix; ruff target-version stays py310.
strict = true
ignore_missing_imports = true

# FastMCP's @mcp.tool() decorator types vary across mcp releases (some
# versions type it as returning an untyped callable), which flips
# untyped-decorator errors on and off between environments. The tool
# functions themselves stay fully annotated.
[[tool.mypy.overrides]]
module = "apab.mcp.*"
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
