name: Prose

on:
  pull_request:
    paths:
      - "**/*.md"

jobs:
  slopcheck:
    runs-on: ubuntu-latest
    # Advisory: findings are for review, not a merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: slopscore-lint
        run: |
          pip install slopscore-lint
          slopscore-lint scan README.md CONTRIBUTING.md docs lab --strictness sensitive --fail-on high

      - name: slopless
        if: always()
        continue-on-error: true
        run: npx --yes slopless "README.md" "docs/**/*.md" "lab/**/*.md"
