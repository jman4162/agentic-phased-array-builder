# Local trace-viewing lab: a single Jaeger container with native OTLP
# ingest. See lab/README.md for usage.
services:
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    container_name: apab-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (APAB's default exporter)
    restart: unless-stopped
